<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  Open Graph share card, 1200x630.

  This is the same lockup as the homepage hero and the printed brochure
  covers, in the same order: chrome monogram, full company name, gold star
  rule, then the shot. Registration follows the identical percentage system
  documented in Landing.tsx — the tank's muzzle sits at 99.92%/49.93% of
  abrams.webp, the blast asset carries its bore axis on its exact vertical
  centre with the attach point at 11.450% of its width, so the barrel, the
  centre of the gas mass and the forward jet share one horizontal line.

  Render:  node scripts/render-og.mjs
-->
<style>
  @font-face {
    font-family: "Fraunces";
    src: url("node_modules/@fontsource-variable/fraunces/files/fraunces-latin-wght-normal.woff2") format("woff2");
    font-weight: 100 900;
  }
  @font-face {
    font-family: "Inter";
    src: url("node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2");
    font-weight: 100 900;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background:
      radial-gradient(ellipse 60% 55% at 22% 30%, rgba(99,199,194,0.10), transparent 70%),
      radial-gradient(ellipse 55% 50% at 82% 75%, rgba(201,168,105,0.10), transparent 70%),
      #0b0e13;
    font-family: Inter, sans-serif;
  }

  .eyebrow {
    position: absolute; top: 40px; left: 0; right: 0; text-align: center;
    font-size: 17px; letter-spacing: 0.24em; color: #8fd8d4; text-transform: uppercase;
  }

  /* Chrome monogram — machined metal, lit from above. */
  .mark {
    position: absolute; top: 68px; left: 0; right: 0; text-align: center;
    font-weight: 900; font-size: 68px; line-height: 0.95; letter-spacing: 0.055em;
    background-image: linear-gradient(174deg,
      #ffffff 0%, #eef2f6 14%, #b9c4cf 31%, #ffffff 47%,
      #dbe3ea 56%, #8c98a5 74%, #cfd8e0 90%, #f4f7fa 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.55));
  }

  /* The full company name is the focal point, not the initialism. */
  .name {
    position: absolute; top: 148px; left: 0; right: 0; text-align: center;
    font-weight: 800; font-size: 23px; line-height: 1.34; letter-spacing: 0.135em;
    text-transform: uppercase; color: #ffffff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }

  /* Gold star on a tracer rule — the small repeating brand device. */
  .star-rule {
    position: absolute; top: 232px; left: 340px; width: 520px;
    display: flex; align-items: center; gap: 8px;
  }
  .star-rule .sr-line { flex: 1; height: 2.5px; border-radius: 999px; }
  .star-rule .sr-line.l { background: linear-gradient(90deg, rgba(201,168,105,0) 0%, #c9a869 100%); }
  .star-rule .sr-line.r { background: linear-gradient(90deg, #c9a869 0%, rgba(201,168,105,0) 100%); }

  /* The shot. Percentages are the shared registration contract. */
  .lockup { position: absolute; top: 252px; left: 255px; width: 690px; height: 215.5px; }
  .ground {
    position: absolute; top: 78%; left: -5%; width: 58%; height: 30%; border-radius: 50%;
    background: radial-gradient(ellipse 60% 100% at 50% 50%,
      rgba(120,148,178,0.16) 0%, rgba(90,116,145,0.07) 45%, rgba(11,14,19,0) 78%);
  }
  .tank {
    position: absolute; top: 8.815%; left: 0; width: 49.858%; height: auto;
    filter: brightness(1.18) contrast(1.05);
    -webkit-mask-image: radial-gradient(ellipse 92% 88% at 50% 50%, black 58%, transparent 98%);
    mask-image: radial-gradient(ellipse 92% 88% at 50% 50%, black 58%, transparent 98%);
  }
  .blast { position: absolute; top: 0; left: 37.521%; width: 62.479%; height: auto; }

  .promise {
    position: absolute; top: 476px; left: 0; right: 0; text-align: center;
    font-family: Fraunces, serif; font-weight: 480; font-size: 33px; line-height: 1.14;
    letter-spacing: -0.015em;
  }
  .promise .a { color: #f2efe8; }
  .promise .b { color: #8fd8d4; }
  .promise .c { color: #ddc491; }

  .foot {
    position: absolute; bottom: 34px; left: 0; right: 0; text-align: center;
    font-size: 14px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
    color: #ddc491;
  }
</style>
</head>
<body>
  <div class="eyebrow">Secure AI · Intelligent Automation · Cybersecurity · Compliance Readiness</div>
  <div class="mark">BSTS</div>
  <div class="name">Bevier Strategic<br>Technology Solutions</div>

  <div class="star-rule">
    <span class="sr-line l"></span>
    <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0.6 L14.5 9.5 L23.4 12 L14.5 14.5 L12 23.4 L9.5 14.5 L0.6 12 L9.5 9.5 Z" fill="#c9a869"/></svg>
    <span class="sr-line r"></span>
  </div>

  <div class="lockup">
    <div class="ground"></div>
    <img class="tank" src="public/abrams.webp" alt="">
    <img class="blast" src="public/blast-envelope.webp" alt="">
  </div>

  <div class="promise">
    <span class="a">Secure the data.</span>
    <span class="b">Enable the AI.</span>
    <span class="c">Prove the controls.</span>
  </div>

  <div class="foot">Service-Disabled Veteran-Owned &amp; Operated</div>
</body>
</html>
