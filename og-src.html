<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  Open Graph share card, 1200x630.

  This is the same lockup as the homepage hero and the printed brochure
  covers, in the same order: chrome monogram, full company name, gold star
  rule, then the shot. The bore axis and blast width here were tuned
  independently of src/components/brand/lockup.ts's solve() (this card
  renders the flash larger, relative to the tank, than the on-site hero
  does, for punch at thumbnail size) — the tank width happens to match
  the site's old computed value, the blast width and position do not, so
  don't assume parity with lockup.ts's percentages for anything below.

  What IS shared with every other surface: abrams-tank.webp's muzzle sits
  at 91.33% of its width / 61.99% of its height, and blast-envelope.webp's
  bore axis is its exact vertical centre. The attach point — which fraction
  of the blast bitmap's own width lands on the muzzle — used to be 27.06%,
  a point already deep inside the fireball's fully-opaque core, which is
  why the flash used to bury the gun tube almost back to the bore
  evacuator. A first fix moved it to this bitmap's first column with any
  alpha above 20/255 (2.506%) — that stopped the burial but was too faint
  to read as fire, leaving a dark notch between the masked, anti-aliased
  muzzle tip and the flash. It went to 4.495% next, where the bitmap's own
  peak-alpha-per-column ramp clears roughly a third of full opacity —
  verified empirically by compositing tank+blast at this fraction and
  checking no near-background row separates them.

  It's now 6.264% (column 85 of the bitmap's 1357, ~95% of full opacity),
  pulled in further by direct request against the live site. This bitmap's
  alpha ramp has no plateau — it climbs smoothly from 2 to fully opaque
  only at column 88 — so there was room to move the attach point later
  along it without recreating the original bug, which buried a genuinely
  flat, already-opaque stretch of fire over the tube. Confirmed at each
  step (5% → 5.8% → 6.3%) against rendered composites: no near-background
  row separates tube and fire, and the muzzle's own bore-evacuator knob
  stays visible throughout. Same fraction, same reasoning, applied to the
  hero and both brochure covers (the brochures use a different, lower-
  resolution print bitmap, so their own attach fraction is a separately
  measured equivalent, not this same percentage).

  Render:  node scripts/render-og.mjs
-->
<style>
  @font-face {
    font-family: "Fraunces";
    src: url("node_modules/@fontsource-variable/fraunces/files/fraunces-latin-wght-normal.woff2") format("woff2");
    font-weight: 100 900;
  }
  @font-face {
    font-family: "Inter";
    src: url("node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2");
    font-weight: 100 900;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background:
      radial-gradient(ellipse 60% 55% at 22% 30%, rgba(99,199,194,0.10), transparent 70%),
      radial-gradient(ellipse 55% 50% at 82% 75%, rgba(201,168,105,0.10), transparent 70%),
      #0b0e13;
    font-family: Inter, sans-serif;
  }

  .eyebrow {
    position: absolute; top: 40px; left: 0; right: 0; text-align: center;
    font-size: 17px; letter-spacing: 0.24em; color: #8fd8d4; text-transform: uppercase;
  }

  /* Chrome monogram — machined metal, lit from above. */
  .mark {
    position: absolute; top: 68px; left: 0; right: 0; text-align: center;
    font-weight: 900; font-size: 68px; line-height: 0.95; letter-spacing: 0.055em;
    background-image: linear-gradient(174deg,
      #ffffff 0%, #eef2f6 14%, #b9c4cf 31%, #ffffff 47%,
      #dbe3ea 56%, #8c98a5 74%, #cfd8e0 90%, #f4f7fa 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.55));
  }

  /* The full company name is the focal point, not the initialism. */
  .name {
    position: absolute; top: 148px; left: 0; right: 0; text-align: center;
    font-weight: 800; font-size: 23px; line-height: 1.32; letter-spacing: 0.145em;
    text-transform: uppercase; color: #e8d2a4;
    text-shadow: 0 1px 2px rgba(0,0,0,0.55);
  }

  /* Gold star on a tracer rule — the small repeating brand device. */
  .star-rule {
    position: absolute; top: 232px; left: 340px; width: 520px;
    display: flex; align-items: center; gap: 8px;
  }
  .star-rule .sr-line { flex: 1; height: 2.5px; border-radius: 999px; }
  .star-rule .sr-line.l { background: linear-gradient(90deg, rgba(201,168,105,0) 0%, #c9a869 100%); }
  .star-rule .sr-line.r { background: linear-gradient(90deg, #c9a869 0%, rgba(201,168,105,0) 100%); }

  /* The shot. Percentages are the shared registration contract. */
  .lockup { position: absolute; top: 262px; left: 255px; width: 690px; height: 189.6px; }
  .horizon { position: absolute; height: 1.5px;
    background: linear-gradient(90deg, rgba(150,176,202,0) 0%, rgba(150,176,202,.26) 22%,
      rgba(150,176,202,.38) 50%, rgba(150,176,202,.26) 78%, rgba(150,176,202,0) 100%);
    top: 85.245%; left: -8.560%; width: 72.484%; }
  .contact { position: absolute; border-radius: 50%; height: 9.2%;
    background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(0,0,0,.70) 0%,
      rgba(0,0,0,.40) 32%, rgba(0,0,0,.14) 58%, rgba(0,0,0,0) 80%);
    top: 80.645%; left: 6.249%; width: 42.867%; }
  .tank {
    position: absolute; top: 0.000%; left: 0; width: 59.596%; height: auto;
    filter: brightness(1.14) contrast(1.04);
    -webkit-mask-image: radial-gradient(ellipse 92% 88% at 50% 50%, black 58%, transparent 98%);
    mask-image: radial-gradient(ellipse 92% 88% at 50% 50%, black 58%, transparent 98%);
  }
  .blast { position: absolute; top: 0; left: 50.513%; width: 62.479%; height: auto; }
  .dart { position: absolute; top: 49.767%; left: 101.441%; width: 11.3%; height: auto; }

  .promise {
    position: absolute; top: 476px; left: 0; right: 0; text-align: center;
    font-family: Fraunces, serif; font-weight: 480; font-size: 33px; line-height: 1.14;
    letter-spacing: -0.015em;
  }
  .promise .a { color: #f2efe8; }
  .promise .b { color: #8fd8d4; }
  .promise .c { color: #ddc491; }

  .foot {
    position: absolute; bottom: 34px; left: 0; right: 0; text-align: center;
    font-size: 14px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
    color: #ddc491;
  }
</style>
</head>
<body>
  <div class="eyebrow">Secure AI · Intelligent Automation · Cybersecurity · Compliance Readiness</div>
  <div class="mark">BSTS</div>
  <div class="name">Bevier Strategic<br>Technology Solutions</div>

  <div class="star-rule">
    <span class="sr-line l"></span>
    <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0.6 L14.5 9.5 L23.4 12 L14.5 14.5 L12 23.4 L9.5 14.5 L0.6 12 L9.5 9.5 Z" fill="#c9a869"/></svg>
    <span class="sr-line r"></span>
  </div>

  <div class="lockup">
    <div class="horizon"></div>
    <div class="contact"></div>
    <img class="tank" src="public/abrams-tank.webp" alt="">
    <img class="blast" src="public/blast-envelope.webp" alt="">
    <img class="dart" src="public/projectile.svg" alt="" aria-hidden="true">
  </div>

  <div class="promise">
    <span class="a">Secure the data.</span>
    <span class="b">Enable the AI.</span>
    <span class="c">Prove the controls.</span>
  </div>

  <div class="foot">Service-Disabled Veteran-Owned &amp; Operated</div>
</body>
</html>
