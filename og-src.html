<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Fraunces";
    src: url("node_modules/@fontsource-variable/fraunces/files/fraunces-latin-wght-normal.woff2") format("woff2");
    font-weight: 100 900;
  }
  @font-face {
    font-family: "Inter";
    src: url("node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2");
    font-weight: 100 900;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background:
      radial-gradient(ellipse 60% 55% at 22% 30%, rgba(99,199,194,0.10), transparent 70%),
      radial-gradient(ellipse 55% 50% at 82% 75%, rgba(201,168,105,0.10), transparent 70%),
      #0b0e13;
  }
  .eyebrow {
    position: absolute; top: 84px; left: 0; right: 0; text-align: center;
    font-family: Inter, sans-serif; font-size: 21px; letter-spacing: 0.24em;
    color: #8fd8d4; text-transform: uppercase;
  }
  .tank { position: absolute; top: 200px; left: -100px; height: 260px; width: auto;
    -webkit-mask-image: radial-gradient(ellipse 92% 88% at 50% 50%, black 55%, transparent 98%);
    mask-image: radial-gradient(ellipse 92% 88% at 50% 50%, black 55%, transparent 98%);
  }
  .name {
    position: absolute; top: 272px; left: 0; right: 0; text-align: center;
    font-family: Fraunces, serif; font-weight: 640; font-size: 28px;
    letter-spacing: 0.085em; text-transform: uppercase; white-space: nowrap;
    background-image: linear-gradient(180deg, #f8f3e8 0%, #eee0c4 52%, #d3ab61 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .line {
    position: absolute; top: 318px; left: 260px; right: 212px; height: 3px; border-radius: 999px;
    background: linear-gradient(90deg, rgba(221,196,145,0.8), rgba(221,196,145,0.4));
  }
  .flash {
    position: absolute; top: 306px; left: 236px; width: 46px; height: 26px; border-radius: 999px;
    background: radial-gradient(ellipse at 30% 50%, #ffe9b8 0%, rgba(255,217,138,0.7) 40%, rgba(255,217,138,0) 100%);
  }
  .dart { position: absolute; top: 286px; right: 56px; width: 150px; }
  .dart .label {
    display: block; text-align: center; font-family: Fraunces, serif; font-weight: 700;
    font-size: 24px; letter-spacing: 0.22em; color: #ddc491; margin-bottom: 8px;
  }
  .rod { position: relative; display: block; width: 130px; height: 7px; margin: 0 auto;
    background: linear-gradient(90deg, #caa15a, #ffd98a); border-radius: 2px;
    box-shadow: 0 0 14px rgba(255,217,138,0.55), 0 0 38px rgba(255,217,138,0.25);
  }
  .rod::after { content: ""; position: absolute; left: 100%; top: -2.5px;
    border-top: 6px solid transparent; border-bottom: 6px solid transparent;
    border-left: 30px solid #d8ae62; filter: drop-shadow(0 0 8px rgba(255,217,138,0.45));
  }
  .rod::before { content: ""; position: absolute; right: 100%; top: -9px; width: 20px; height: 25px;
    background: #c69a55; clip-path: polygon(100% 27%, 0 0, 45% 50%, 0 100%, 100% 73%);
  }
  .tagline {
    position: absolute; top: 420px; left: 0; right: 0; text-align: center;
    font-family: Fraunces, serif; font-weight: 480; font-size: 46px; color: #f2efe8;
  }
  .tagline .accent { color: #8fd8d4; }
</style>
</head>
<body>
  <p class="eyebrow">Secure AI &middot; Intelligent Automation &middot; Connected Systems</p>
  <img class="tank" src="public/abrams.webp">
  <p class="name">Bevier Strategic Technology Solutions</p>
  <span class="flash"></span>
  <span class="line"></span>
  <span class="dart"><span class="label">BSTS</span><span class="rod"></span></span>
  <p class="tagline">A force multiplier for the team <span class="accent">you already have.</span></p>
</body>
</html>
