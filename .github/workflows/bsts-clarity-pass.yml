name: BSTS clarity pass validation
on:
  push:
    branches: [bsts-commercial-refresh-2026-09-10]
    paths:
      - scripts/apply-commercial-clarity.py
      - src/lib/content/commercial.ts
      - src/components/marketing/BusinessContact.tsx
      - src/components/marketing/SolutionsOverview.tsx
      - src/test/commercial-clarity.test.ts
      - .github/workflows/bsts-clarity-pass.yml
permissions:
  contents: read
concurrency:
  group: bsts-clarity-review
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply exact copy-only changes
        run: |
          python3 scripts/apply-commercial-clarity.py
          git diff --check
          git diff --exit-code -- public src/components/brand src/app/globals.css src/lib/breakdown.ts src/components/assessment
          mkdir -p clarity-review
          git diff --binary > clarity-review/source-changes.patch
          python3 scripts/apply-commercial-clarity.py
          git diff --binary > clarity-review/idempotence.patch
          cmp clarity-review/source-changes.patch clarity-review/idempotence.patch
          rm clarity-review/idempotence.patch
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests including assessment and brand guards
        run: npm run test
      - name: Static production build
        run: npm run build
      - name: Capture desktop and mobile previews
        run: |
          python3 -m http.server 4173 --directory out >/tmp/bsts-preview-server.log 2>&1 &
          for attempt in 1 2 3 4 5; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          CHROME=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$CHROME" ]; then
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=6000 --window-size=1440,1200 --screenshot="$PWD/clarity-review/home-desktop.png" http://127.0.0.1:4173/
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=6000 --window-size=390,844 --screenshot="$PWD/clarity-review/home-mobile.png" http://127.0.0.1:4173/
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=6000 --window-size=1440,1200 --screenshot="$PWD/clarity-review/services-desktop.png" http://127.0.0.1:4173/services/
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=6000 --window-size=390,844 --screenshot="$PWD/clarity-review/contact-mobile.png" http://127.0.0.1:4173/contact/
          else
            echo 'Browser unavailable: visual inspection remains outstanding.' > clarity-review/VISUAL_CHECK_REQUIRED.txt
          fi
          printf '%s\n' "Validated source base: $GITHUB_SHA" > clarity-review/validation.txt
          git diff --stat >> clarity-review/validation.txt
          cp -r src clarity-review/source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bsts-clarity-review
          path: clarity-review/
          retention-days: 7
  save-validated-changes:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bsts-commercial-refresh-2026-09-10
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: bsts-clarity-review
          path: /tmp/bsts-clarity-review
      - name: Save only the tested changes to the review branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          if [ ! -s /tmp/bsts-clarity-review/source-changes.patch ]; then exit 0; fi
          git apply --check /tmp/bsts-clarity-review/source-changes.patch
          git apply /tmp/bsts-clarity-review/source-changes.patch
          git diff --check
          git diff --exit-code -- public src/components/brand src/app/globals.css src/lib/breakdown.ts src/components/assessment
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/site.ts src/components/landing/Landing.tsx src/components/marketing/Footer.tsx 'src/app/(marketing)/contact/page.tsx' 'src/app/(marketing)/services/page.tsx' src/lib/content/services.ts
          git commit -m 'Clarify BSTS offer and contact paths; preserve approved brand and assessment'
          git push origin HEAD:bsts-commercial-refresh-2026-09-10
