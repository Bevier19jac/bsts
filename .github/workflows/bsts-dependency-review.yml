name: BSTS dependency release checks
on:
  push:
    branches: [bsts-commercial-refresh-2026-09-10]
    paths: [.github/workflows/bsts-dependency-review.yml]
permissions:
  contents: read
concurrency:
  group: bsts-dependency-review
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: '1'
  REVIEW_BASE: eaacbfefb4548c14d7c23b687f93d47ceeb61796
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Record baseline and exact upstream package metadata
        run: |
          mkdir -p dependency-review
          cp package.json dependency-review/package-before.json
          npm audit --json > dependency-review/audit-before.json || true
          npm view next@16.3.4 version engines peerDependencies dist.integrity --json > dependency-review/next-upstream.json
          npm view vitest@4.1.11 version engines dist.integrity --json > dependency-review/vitest-upstream.json
      - name: Resolve patched packages without forced major upgrades
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact next@16.3.4
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact eslint-config-next@16.3.4 vitest@4.1.11
          npm audit fix --package-lock-only --ignore-scripts > dependency-review/audit-fix.log 2>&1 || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          before = json.loads(Path('dependency-review/package-before.json').read_text())
          after = json.loads(Path('package.json').read_text())
          expected = json.loads(json.dumps(before))
          expected['dependencies']['next'] = '16.3.4'
          expected['devDependencies']['eslint-config-next'] = '16.3.4'
          expected['devDependencies']['vitest'] = '4.1.11'
          assert after == expected, 'Unexpected manifest change; stop for review'
          PY
          git diff --check
          git diff --exit-code "$REVIEW_BASE" -- src public next.config.ts
          test "$(git diff --name-only | sort | tr '\n' ' ')" = 'package-lock.json package.json '
      - name: Install from the updated lockfile
        run: npm ci
      - name: Record complete dependency audit
        run: |
          npm audit --json > dependency-review/audit-after.json || true
          node -e "const r=require('./dependency-review/audit-after.json'); if(r.error || !r.metadata?.vulnerabilities) process.exit(1); console.log(JSON.stringify(r.metadata.vulnerabilities));"
          npm ls next eslint-config-next vitest --depth=0 > dependency-review/resolved-versions.txt
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Assessment, brand, and regression tests
        run: npm run test 2>&1 | tee dependency-review/test-results.txt
      - name: Production static export
        run: npm run build 2>&1 | tee dependency-review/build-results.txt
      - name: Check exported contact and solution paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(); self.links=[]; self.ids=set()
              def handle_starttag(self, tag, attrs):
                  data=dict(attrs)
                  if 'id' in data: self.ids.add(data['id'])
                  if tag=='a' and 'href' in data: self.links.append(data['href'])
          routes=['index.html','services/index.html','contact/index.html','government/index.html','start/index.html']
          for route in routes:
              text=Path('out',route).read_text(); p=Links(); p.feed(text)
              assert 'mailto:jacob@bevierstrategic.com' in p.links, route
              assert 'tel:+14046182346' in p.links, route
              assert 'Secure the data.' in text and 'Enable the AI.' in text and 'Prove the controls.' in text, route
          p=Links(); p.feed(Path('out/services/index.html').read_text())
          assert {'workflow-automation','prospecting-sales','client-intelligence','custom-software'} <= p.ids
          for asset in ['sitemap.xml','robots.txt']:
              assert Path('out',asset).is_file(), asset
          print('Static route, contact-link, solution-anchor and slogan checks passed.')
          PY
      - name: Capture approved pages after the dependency update
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out >/tmp/bsts-dependency-preview.log 2>&1 &
          for attempt in 1 2 3 4 5; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          CHROME=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$CHROME" ]; then
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=6000 --window-size=1440,1200 --screenshot="$PWD/dependency-review/home-desktop.png" http://127.0.0.1:4173/
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=6000 --window-size=390,844 --screenshot="$PWD/dependency-review/home-mobile.png" http://127.0.0.1:4173/
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=6000 --window-size=1440,1200 --screenshot="$PWD/dependency-review/services-desktop.png" http://127.0.0.1:4173/services/
          else
            echo 'Browser unavailable; visual check outstanding.' > dependency-review/VISUAL_CHECK_REQUIRED.txt
          fi
      - name: Require clean audit and package-only changes
        run: |
          node -e "const r=require('./dependency-review/audit-after.json'); if(r.error || r.metadata.vulnerabilities.total !== 0) { console.error('Dependency advisories remain; do not save as approved.'); process.exit(1); }"
          git diff --check
          git diff --exit-code "$REVIEW_BASE" -- src public next.config.ts
          git diff --binary -- package.json package-lock.json > dependency-review/dependencies.patch
          cp package.json dependency-review/package-after.json
          cp package-lock.json dependency-review/package-lock-after.json
          printf '%s\n' "Validated workflow source: $GITHUB_SHA" "Application source preserved from: $REVIEW_BASE" > dependency-review/validation.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bsts-dependency-review
          path: dependency-review/
          retention-days: 7
  save-tested-dependencies:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: bsts-commercial-refresh-2026-09-10
      - uses: actions/download-artifact@v4
        with:
          name: bsts-dependency-review
          path: /tmp/bsts-dependency-review
      - name: Save only tested package manifests to the review branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          if [ ! -s /tmp/bsts-dependency-review/dependencies.patch ]; then exit 0; fi
          git apply --check /tmp/bsts-dependency-review/dependencies.patch
          git apply /tmp/bsts-dependency-review/dependencies.patch
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = 'package-lock.json package.json '
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'Patch audited dependencies; preserve approved website and assessment source'
          git push origin HEAD:bsts-commercial-refresh-2026-09-10
